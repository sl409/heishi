<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
const T=16;
let W,H,DPR,SC;const ZOOMS=[17.5,14,11];let ZI=0;try{ZI=+(localStorage.getItem('mine_zoom')||0)%3}catch(e){}
let ROT=false;
function resize(){const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;ROT=false;document.body.classList.toggle('rot',ROT);const lw=ROT?innerHeight:innerWidth,lh=ROT?innerWidth:innerHeight;document.body.classList.toggle('land',lw>lh);
 DPR=Math.min(2,window.devicePixelRatio||1);W=lw;H=lh;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  SC=Math.max(1.5,Math.round(Math.min(cv.width,cv.height)/(T*ZOOMS[ZI])*4)/4);lc.width=Math.ceil(cv.width/(SC*2))+3;lc.height=Math.ceil(cv.height/(SC*2))+3;}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');f(g,w,h);return c}
function px(g,x,y,c){g.fillStyle=c;g.fillRect(x,y,1,1)}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=k<0?0:255,a=Math.abs(k);r=Math.round(r+(f-r)*a);g=Math.round(g+(f-g)*a);b=Math.round(b+(f-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function pickW(tb,r){let s=0;for(const a of tb)s+=a[1];let x=r()*s;for(const a of tb){x-=a[1];if(x<=0)return a[0]}return tb[0][0]}
// storage: localStorage -> IndexedDB -> memory only
let LS_OK=false;try{localStorage.setItem('__t','1');LS_OK=localStorage.getItem('__t')==='1';localStorage.removeItem('__t')}catch(e){LS_OK=false}
let IDB=null,IDB_OK=false;const MEMS={};
function idbOpen(){return new Promise(res=>{try{const rq=indexedDB.open('blackstone',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>{IDB=rq.result;res(true)};rq.onerror=()=>res(false);setTimeout(()=>res(false),1500)}catch(e){res(false)}})}
function idbAll(){return new Promise(res=>{try{const tx=IDB.transaction('kv','readonly'),st=tx.objectStore('kv'),out={};const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res({})}})}
function idbPut(k,v){try{const tx=IDB.transaction('kv','readwrite');v===undefined?tx.objectStore('kv').delete(k):tx.objectStore('kv').put(v,k)}catch(e){}}
async function storageInit(){if(LS_OK)return;if(await idbOpen()){const all=await idbAll();Object.assign(MEMS,all);try{idbPut('__t','1');IDB_OK=true}catch(e){}}}
const store={get(k){try{if(LS_OK)return JSON.parse(localStorage.getItem(k));return MEMS[k]?JSON.parse(MEMS[k]):null}catch(e){return null}},
 set(k,v){const j=JSON.stringify(v);MEMS[k]=j;if(LS_OK){try{localStorage.setItem(k,j)}catch(e){}}else if(IDB)idbPut(k,j)},
 del(k){delete MEMS[k];if(LS_OK){try{localStorage.removeItem(k)}catch(e){}}else if(IDB)idbPut(k,undefined)}};
const persistOK=()=>LS_OK||IDB_OK;
// save codes
function b64e(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const s=atob(str),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function makeCode(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));try{if(window.CompressionStream){const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return'HS1.'+b64e(buf)}}catch(e){}return'HS0.'+b64e(raw)}
const SKEYS=['day','money','pick','bag','lamp','boots','bombs','deepest','best','bestV','earned','seed','notes','shown','stash','code','codeF','keyLv','key','gun','ledger','stable','list','xhKnows','freePrice','safe','bed','skims','read','used','lifts','maxY','mapv','atNight','xhMet','xhDay','oldQ','dummy','booze','det','chute','flares','amulet','decor','phonoOn','gambled','zinfo','debt','debtDay','penDay','box','boxLv','recall'];
function vEnc(arr,v){v=Math.max(0,Math.floor(v));while(v>=128){arr.push((v&127)|128);v=Math.floor(v/128)}arr.push(v)}
function vDec(b,pos){let v=0,m=1;while(true){const x=b[pos.i++];v+=(x&127)*m;if(x<128)break;m*=128}return v}
async function deflate(u8){if(!window.CompressionStream)return null;const cs=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));return new Uint8Array(await new Response(cs).arrayBuffer())}
async function inflate(u8){const ds=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(ds).arrayBuffer())}
function cjkEnc(bytes){let out='',acc=0,n=0;for(const b of bytes){acc=acc*256+b;n+=8;while(n>=14){n-=14;const v=Math.floor(acc/Math.pow(2,n));acc-=v*Math.pow(2,n);out+=String.fromCharCode(0x4E00+v)}}if(n>0)out+=String.fromCharCode(0x4E00+acc*Math.pow(2,14-n));return out}
function cjkDec(str,len){const out=[];let acc=0,n=0;for(const ch of str){const v=ch.charCodeAt(0)-0x4E00;if(v<0||v>=16384)throw 0;acc=acc*16384+v;n+=14;while(n>=8&&out.length<len){n-=8;const b=Math.floor(acc/Math.pow(2,n));acc-=b*Math.pow(2,n);out.push(b)}}return new Uint8Array(out)}
async function makeShort(g,en){const vals=SKEYS.map(k=>g[k]===undefined?null:g[k]);const rest={};for(const k in g)if(!SKEYS.includes(k)&&k!=='dug')rest[k]=g[k];
 const js=new TextEncoder().encode(JSON.stringify([vals,rest,en||{}]));const dug=new Set(g.dug||[]);const N=MW*MH;const runs=[];let cur=0,n=0;for(let i=0;i<N;i++){const b=dug.has(i)?1:0;if(b===cur)n++;else{runs.push(n);cur=b;n=1}}runs.push(n);
 const body=[];vEnc(body,js.length);for(const b of js)body.push(b);vEnc(body,runs.length);for(const r of runs)vEnc(body,r);
 let u=new Uint8Array(body),flag='原';try{const d=await deflate(u);if(d&&d.length<u.length){u=d;flag='矿'}}catch(e){}
 const hdr=[];vEnc(hdr,u.length);const all=new Uint8Array(hdr.length+u.length);all.set(hdr);all.set(u,hdr.length);return'黑石'+flag+cjkEnc(all)}
async function readShort(code){const flag=code[2];const raw=code.slice(3);// length prefix: decode enough to read varint
 const probe=cjkDec(raw,6);const pos={i:0};const L=vDec(probe,pos);const all=cjkDec(raw,pos.i+L);let u=all.slice(pos.i);if(flag==='矿')u=await inflate(u);
 const q={i:0};const jl=vDec(u,q);const js=JSON.parse(new TextDecoder().decode(u.slice(q.i,q.i+jl)));q.i+=jl;const rn=vDec(u,q);const dug=[];let idx=0,cur=0;for(let k=0;k<rn;k++){const r=vDec(u,q);if(cur)for(let j=0;j<r;j++)dug.push(idx+j);idx+=r;cur=1-cur}
 const g={};SKEYS.forEach((k,i)=>{if(js[0][i]!==null)g[k]=js[0][i]});Object.assign(g,js[1]);g.dug=dug;return{g,e:js[2]}}
async function readCode(code){code=code.trim().replace(/\s+/g,'');if(code.startsWith('黑石'))return readShort(code);const m=code.match(/^HS([01])\.(.+)$/);if(!m)throw 0;let bytes=b64d(m[2]);if(m[1]==='1'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}return JSON.parse(new TextDecoder().decode(bytes))}
async function exportCode(){const sv=store.get('mine_save_v2');if(!sv){toast('还没有存档（第一天结束后才有）');return}const code=await makeShort(sv,store.get('mine_endings')||{});
 showOv('<div class="panel"><h2>存档码</h2><div class="small">这是你上一次存档（每天早上和晚上自动存）的全部进度。复制下来，存在备忘录或者发给自己。换了浏览器，或者自动存档没了，在标题画面点「输入存档码」就能接着玩。</div><textarea id="codebox" readonly style="width:100%;height:140px;margin-top:10px;background:#0c0a08;color:#e6d8bc;border:2px solid #3e3128;font-family:monospace;font-size:11px;padding:6px;word-break:break-all;user-select:text;-webkit-user-select:text">'+code+'</textarea><div class="small" style="margin-top:4px">第 '+sv.day+' 天'+(sv.atNight?' · 夜':'')+' · '+code.length+' 个字符</div><div style="display:flex;gap:8px;margin-top:10px"><button class="pbtn gold" style="flex:1" id="cpcode">复制</button><button class="pbtn" style="flex:1" id="clcode">关闭</button></div></div>');
